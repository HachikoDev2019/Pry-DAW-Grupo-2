<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomalca - Registro de Requerimiento</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f6; 
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            border-top: 5px solid #2ecc71; /* Verde Agro */
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #34495e;
        }
        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2ecc71;
        }
        button {
            width: 100%;
            padding: 1rem;
            background-color: #27ae60;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Nuevo Requerimiento</h2>
    <p class="subtitle">Portal de Logística - Agroindustrial Pomalca</p>
    
    <form action="{{ url_for('guardar_requerimiento') }}" method="POST">
        
        <div class="form-group">
            <label for="titulo">Título del Requerimiento</label>
            <input type="text" id="titulo" name="titulo" placeholder="Ej. Repuestos para Tractor John Deere" required>
        </div>

        <div class="form-group">
            <label for="area">Área Solicitante</label>
            <select id="area" name="area" required>
                <option value="campo">Campo</option>
                <option value="fabrica">Fábrica (Molienda)</option>
                <option value="ti">Tecnología de la Información</option>
                <option value="recursos_humanos">Recursos Humanos</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fecha_limite">Fecha Límite para Cotizar</label>
            <input type="date" id="fecha_limite" name="fecha_limite" required>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción Técnica</label>
            <textarea id="descripcion" name="descripcion" rows="4" placeholder="Detalle las especificaciones técnicas para los proveedores..." required></textarea>
        </div>

        <button type="submit">Publicar Requerimiento</button>
    </form>
</div>

</body>
</html>
