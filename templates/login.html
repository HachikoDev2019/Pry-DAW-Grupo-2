<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Azucarera Pomalca</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}"> 
</head>
<body class="login-body"> 
    
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 28px;">
            <div class="logo-login">POMALCA</div>
            <h1 style="font-size: 22px; font-weight: 800; margin-bottom: 6px; color: #1e2a3a;">Portal de Personal</h1>
            <p style="font-size: 13.5px; color: #7a8fa6;">Gestión de Solicitudes e Ingresos</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ 'error' if category == 'error' else 'success' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST"> 
            <div class="form-group-vertical">
                <label for="dni">Número de DNI</label>
                <div class="input-wrap">
                    <span class="input-prefix">#</span>
                    <input type="text" id="dni" name="dni" placeholder="Ej. 45678912" maxlength="8" required pattern="\d{8}">
                </div>
            </div>

            <div class="form-group-vertical">
                <label for="password">Contraseña de Acceso</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit-block">
                Iniciar Sesión
            </button>
        </form>

        <div style="text-align: center; margin-top: 26px; font-size: 13.5px;">
            <p style="color: #7a8fa6;">
                ¿Es nuevo en el sistema? 
                <a href="{{ url_for('registro') }}" style="color: #5b7fb1; font-weight: 700; text-decoration: none;">Regístrese aquí</a>
            </p>
        </div>
    </div>

</body>
</html>
