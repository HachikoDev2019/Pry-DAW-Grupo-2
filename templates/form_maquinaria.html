<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomalca - Registro de Maquinaria</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            display: flex;
            height: 100vh;
        }
        /* Top Navigation Bar */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #ffffff;
            border-bottom: 2px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }
        .topbar .logo {
            font-size: 24px;
            font-weight: bold;
            color: #5b7fb1; /* Azul Pomalca de tus wireframes */
            border: 2px solid #5b7fb1;
            padding: 5px 15px;
            border-radius: 4px;
        }
        .topbar .title {
            font-weight: bold;
            letter-spacing: 1px;
            color: #333;
        }
        .topbar .user-info {
            text-align: right;
            font-size: 14px;
        }
        .topbar .user-info a {
            color: #e74c3c;
            text-decoration: none;
            font-size: 12px;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background-color: #ffffff;
            border-right: 2px solid #ccc;
            margin-top: 60px; /* Offset for topbar */
            padding-top: 20px;
            height: calc(100vh - 60px);
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar li {
            padding: 15px 20px;
            cursor: pointer;
            color: #555;
            font-weight: 600;
            border-bottom: 1px solid #eee;
        }
        .sidebar li:hover, .sidebar li.active {
            background-color: #f0f0f0;
            border-left: 4px solid #5b7fb1;
        }

        /* Main Content & Form */
        .main-content {
            flex: 1;
            margin-top: 60px;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
        }
        .form-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .form-group label {
            width: 150px;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
        }
        .form-group input, .form-group select, .form-group textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button.btn-submit {
            display: block;
            width: 200px;
            margin: 30px auto 0;
            padding: 12px;
            background-color: #000; /* Botón oscuro del wireframe */
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button.btn-submit:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <!-- Topbar -->
    <div class="topbar">
        <div class="logo">Pomalca</div>
        <div class="title">SISTEMA DE GESTIÓN DE REQUERIMIENTOS INTERNOS</div>
        <div class="user-info">
            Admin (laboratorio)<br>
            <a href="#">Cerrar Sesión</a>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <ul>
            <li>Dashboard</li>
            <li class="active">Mis Requerimientos</li>
            <li>Catálogo de Artículos</li>
            <li>Reportes</li>
            <li>Configuración</li>
        </ul>
    </div>

    <!-- Contenido Principal (Formulario) -->
    <div class="main-content">
        <div class="form-container">
            <h2>Registro de maquinaria</h2>
            
            <form action="{{ url_for('guardar_maquinaria') }}" method="POST">
                
                <div class="form-group">
                    <label for="nombre_codigo">Nombre/Código</label>
                    <input type="text" id="nombre_codigo" name="nombre_codigo" required>
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo</label>
                    <input type="text" id="tipo" name="tipo" placeholder="Ej. Tractor, Caldera..." required>
                </div>

                <div class="form-group">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" name="marca">
                </div>

                <div class="form-group">
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" name="modelo">
                </div>

                <div class="form-group">
                    <label for="area">Área</label>
                    <select id="area" name="area">
                        <option value="Campo">Campo</option>
                        <option value="Fábrica">Fábrica</option>
                        <option value="Logística">Logística</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="Operativo">Operativo</option>
                        <option value="En Mantenimiento">En Mantenimiento</option>
                        <option value="Fuera de Servicio">Fuera de Servicio</option>
                    </select>
                </div>

                <div class="form-group">
                    <label style="align-self: flex-start; margin-top: 10px;" for="observaciones">Observaciones</label>
                    <textarea id="observaciones" name="observaciones" rows="4"></textarea>
                </div>

                <button type="submit" class="btn-submit">Registrar</button>
            </form>
        </div>
    </div>

</body>
</html>
